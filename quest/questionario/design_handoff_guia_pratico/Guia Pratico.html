<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guia Prático — Rota Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #111114;
    --panel: #15151a;
    --panel-2: #1c1c22;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
    --text: #f3f3f4;
    --text-dim: #a0a0a8;
    --text-mute: #6c6c75;
    --gold: #f5b425;
    --gold-soft: #b8842a;
    --gold-glow: rgba(245,180,37,0.18);
    --green: #4ade80;
    --green-soft: #22c55e;
    --red: #ef4444;
    --blue: #60a5fa;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #07070a;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#07070a">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#07070a"/>
    <!-- Hex emblem -->
    <g transform="translate(600 360)" fill="none" stroke="#f5b425" stroke-width="4">
      <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"/>
      <polygon points="0,-130 113,-65 113,65 0,130 -113,65 -113,-65" stroke-opacity="0.5"/>
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" stroke-opacity="0.3"/>
    </g>
    <!-- Sparkle dot in center -->
    <circle cx="600" cy="360" r="14" fill="#f5b425"/>
    <!-- Title -->
    <text x="600" y="600" text-anchor="middle" font-family="serif" font-size="52" fill="#f3f3f4" font-style="italic">Guia Prático</text>
    <text x="600" y="660" text-anchor="middle" font-family="monospace" font-size="20" fill="#f5b425" letter-spacing="6">QUEST · BRIEFING · TREE</text>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="variation-quest-log.jsx"></script>
<script type="text/babel" src="variation-mission-brief.jsx"></script>
<script type="text/babel" src="variation-skill-tree.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Guia Prático — Portugal" subtitle="3 direções em estilo Quest/RPG • Rota Legal">
        <DCSection id="quest-log" title="Direção 1 — Quest Log" subtitle="Grimório de missões, foco em narrativa e progressão">
          <DCArtboard id="ql" label="Quest Log" width={1280} height={1600}>
            <window.QuestLog />
          </DCArtboard>
        </DCSection>
        <DCSection id="mission-brief" title="Direção 2 — Mission Briefing" subtitle="Terminal/dossiê tático, leitura como dashboard de operação">
          <DCArtboard id="mb" label="Mission Briefing" width={1280} height={1600}>
            <window.MissionBrief />
          </DCArtboard>
        </DCSection>
        <DCSection id="skill-tree" title="Direção 3 — Skill Tree" subtitle="Fases como nós conectados em uma trilha visual">
          <DCArtboard id="st" label="Skill Tree" width={1280} height={1700}>
            <window.SkillTree />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
