<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login da Área Aluno — Rota Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../assets/design-system.css" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="../assets/turnstile.js" defer></script>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><div class="orb-3"></div></div>

<nav class="top-nav">
  <div class="container">
    <a class="logo" href="../index.html">
      <img src="../assets/images/logonobg.png" alt="Rota Legal" style="height: 26px; width: auto; display: block;">
      <span>rota-legal-monitor</span>
    </a>
    <div class="nav-right">
      <a class="nav-link" href="../index.html">Voltar ao site</a>
    </div>
  </div>
</nav>

<main>
  <section class="section">
    <div class="container" style="max-width: 460px;">
      <div class="eyebrow"><span class="dot"></span>Área do Aluno</div>
      <h1 class="display-md">Entrar na sua área.</h1>
      <p class="lede" style="margin-bottom: var(--s-xl);">
        Acesso exclusivo para alunos do curso do Henryzuca.
        Use as credenciais que você recebeu por DM no Discord.
      </p>

      <form id="login-form" class="feature-card-dark field-group" autocomplete="on">
        <div>
          <label class="field-label" for="email">Email</label>
          <input
            class="text-input"
            type="email"
            id="email"
            name="email"
            required
            autocomplete="username"
            placeholder="seuemail@gmail.com"
          />
        </div>
        <div>
          <label class="field-label" for="senha">Senha</label>
          <input
            class="text-input"
            type="password"
            id="senha"
            name="senha"
            required
            autocomplete="current-password"
            placeholder="16 caracteres"
          />
          <div class="field-error" id="erro" role="alert" aria-live="polite"></div>
        </div>
        <div id="turnstile-box" style="margin: var(--s-md) 0;"></div>
        <button class="btn btn-primary" type="submit" id="submit-btn">Entrar</button>
      </form>

      <p class="body-sm" style="margin-top: var(--s-xl); color: var(--muted);">
        Ainda não é aluno? Conheça o
        <a class="text-link" href="https://discord.com/invite/zmAcKndhv" target="_blank" rel="noopener noreferrer">Discord do curso</a>
        para entrar na turma.
      </p>
    </div>
  </section>
</main>

<script>
(async function () {
  'use strict';
  const form = document.getElementById('login-form');
  const erro = document.getElementById('erro');
  const submitBtn = document.getElementById('submit-btn');

  // Ja logado? Confirma a sessao no servidor e vai pro hub.
  try {
    const r = await fetch('/api/aluno/session', { credentials: 'include' });
    if (r.ok) {
      window.location.replace('index.html');
      return;
    }
  } catch (_) { /* sem servidor: mostra o form */ }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    erro.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Verificando...';

    const email = document.getElementById('email').value.trim().toLowerCase();
    const senha = document.getElementById('senha').value;

    const ts = window.RotaTurnstile;
    let turnstileToken = '';
    if (ts) {
      await ts.ready();
      if (ts.enabled()) {
        turnstileToken = ts.token();
        if (!turnstileToken) {
          erro.textContent = 'Confirme que voce nao e um robo.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
          return;
        }
      }
    }

    try {
      const res = await fetch('/api/aluno/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, senha, turnstileToken }),
      });
      if (res.ok) {
        window.location.replace('index.html');
        return;
      }
      if (ts) ts.reset();
      erro.textContent = res.status === 429
        ? 'Muitas tentativas. Aguarde alguns minutos.'
        : res.status === 403
        ? 'Verificacao de seguranca falhou. Tente de novo.'
        : 'Email ou senha invalidos.';
    } catch (err) {
      erro.textContent = 'Erro ao verificar credenciais. Tente novamente.';
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });
})();
</script>
</body>
</html>
