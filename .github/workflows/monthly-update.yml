name: Monthly Update


on:
  schedule:
    # Dia 1 de cada mes, as 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Codigo do pais (nl, pt, de, es, ie, it, fr, be, at, au). Vazio = todos.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7  # v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Validate current data
        run: bun run validate

      - name: Run extraction
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL_DEFAULT: claude-haiku-4-5
          ANTHROPIC_MODEL_PREMIUM: claude-sonnet-4-5
          NODE_ENV: production
          COUNTRY_INPUT: ${{ inputs.country }}
        run: |
          if [ -n "$COUNTRY_INPUT" ]; then
            bun run extract "--country=$COUNTRY_INPUT"
          else
            bun run extract
          fi

      - name: Reapply research patches
        # A extracao sobrescreve data/current/ e perde os enriquecimentos
        # manuais (ex: visto D7 portugues). Reaplicamos os patches aqui.
        env:
          COUNTRY_INPUT: ${{ inputs.country }}
        run: |
          if [ -n "$COUNTRY_INPUT" ]; then
            bun run patch:all "--country=$COUNTRY_INPUT"
          else
            bun run patch:all
          fi

      - name: Validate extracted data
        run: bun run validate

      - name: Guard against degraded extraction
        # Compara o data/current novo (ja com patch:all) contra o HEAD anterior e
        # falha se detectar ruido de re-extracao (churn de IDs, contagem disparando,
        # generalRequirements zerado, enriquecimento perdido). Falhar aqui faz o
        # commit e o deploy serem pulados, e abre issue de revisao manual.
        id: guard
        continue-on-error: true
        run: |
          set -o pipefail
          bun run guard 2>&1 | tee guard-output.md

      - name: Open issue on suspect extraction
        if: steps.guard.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "data-update"        --color "0075ca" --description "Dados extraidos atualizados"        --force 2>/dev/null || true
          gh label create "extraction-suspect" --color "b60205" --description "Extracao mensal degradada, revisar" --force 2>/dev/null || true
          gh issue create \
            --title "Extracao suspeita em $(date +%Y-%m-%d)" \
            --body-file guard-output.md \
            --label "data-update,extraction-suspect"

      - name: Generate index.json
        run: bun run index

      - name: Generate site pages
        run: bun run site:generate

      # Geracao do conteudo premium (cenarios) saiu do CI publico no modelo
      # open-core. Roda em fluxo privado, com acesso a src/scenarios.

      - name: Detect changes
        id: diff
        run: bun run diff > diff-output.md
        continue-on-error: true

      - name: Open issue if relevant changes detected
        if: steps.diff.outputs.has_high_relevance == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "data-update"    --color "0075ca" --description "Dados extraidos atualizados" --force 2>/dev/null || true
          gh label create "relevance/high" --color "e11d48" --description "Mudanca de alta relevancia"   --force 2>/dev/null || true
          # GitHub limita corpo de issue a 65536 chars
          if [ $(wc -c < diff-output.md) -gt 65000 ]; then
            { head -c 65000 diff-output.md; printf '\n\n_(diff truncado - ver data/current/ para detalhes completos)_'; } > diff-truncated.md
            mv diff-truncated.md diff-output.md
          fi
          gh issue create \
            --title "Mudanca detectada em $(date +%Y-%m-%d)" \
            --body-file diff-output.md \
            --label "data-update,relevance/high"

      - name: Send email alerts to subscribers
        if: steps.diff.outputs.has_high_relevance == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: bun run alerts:send
        continue-on-error: true

      - name: Commit and push
        if: steps.guard.outcome == 'success'
        run: |
          git config user.name  "rota-legal-bot"
          git config user.email "rota-legal-bot@users.noreply.github.com"
          git add data/ previews/
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca para comitar"
          else
            git commit -m "chore(data): monthly snapshot $(date +%Y-%m-%d)"
            git push origin master
          fi

      - name: Deploy to GitHub Pages
        if: steps.guard.outcome == 'success'
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data/current
          publish_branch: gh-pages
          exclude_assets: 'example.json'
          commit_message: 'chore(pages): deploy data snapshot ${{ github.run_id }}'

      - name: Cleanup temp files
        if: always()
        run: rm -f diff-output.md guard-output.md
