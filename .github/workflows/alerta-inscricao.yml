name: Processar inscrição em alertas

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'alerta-inscricao')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7  # v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Parse subscription and update list
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bun run src/alerts/add-subscriber.ts
        continue-on-error: true

      - name: Handle invalid subscription
        if: steps.parse.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "inscricao-invalida" --color "e11d48" --description "Inscricao em alertas com dados invalidos" --force 2>/dev/null || true
          MSG="${{ steps.parse.outputs.message }}"
          if [ -z "$MSG" ]; then MSG="Nao foi possivel processar o formulario. Confira os campos e edite a issue."; fi
          gh issue edit "${{ github.event.issue.number }}" --add-label "inscricao-invalida" --repo "${{ github.repository }}"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Nao consegui processar sua inscricao: $MSG  Edite a issue corrigindo os campos para tentar de novo."

      - name: Commit updated subscribers
        if: steps.parse.outcome == 'success'
        run: |
          git config user.name  "rota-legal-bot"
          git config user.email "rota-legal-bot@users.noreply.github.com"
          git add data/subscribers.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca em subscribers.json"
          else
            git commit -m "chore(alerts): inscricao via issue #${{ github.event.issue.number }}"
            git push origin HEAD:master
          fi

      - name: Confirm and close issue
        if: steps.parse.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG="${{ steps.parse.outputs.message }}"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "$MSG  Voce esta inscrito nos alertas. Para cancelar, abra uma nova issue ou avise no Discord. Esta issue sera fechada e seu email removido do corpo para reduzir exposicao."
          # Redige o corpo para remover o email do conteudo visivel.
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Inscricao processada. Conteudo original removido para proteger o email do assinante."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
